name: 功能建议
description: 想要新的能力，或对现有行为的改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 你遇到的场景
      description: |
        先说清楚你想解决的问题，而不是直接给方案 —— 同一个问题往往有更简单的解法。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你希望怎样
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过或考虑过的替代做法
      description: 比如现在是怎么绕过去的，或别的工具是怎么做的
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      description: |
        本项目是**本地优先、零凭据、不联网**的仓库盘点工具。
        需要服务端、账号体系或数据上报的需求通常不在范围内。
      options:
        - label: 这个需求不涉及联网、遥测或凭据托管
          required: false

  - type: checkboxes
    id: search
    attributes:
      label: 重复确认
      options:
        - label: 我已搜索过现有 Issue 与 Discussions，没有重复的
          required: true
